[package]
name = "voicebox"
version = "0.1.0"
description = "A local-first ASR model evaluation workbench"
authors = ["Voicebox contributors"]
edition = "2021"

[lib]
name = "voicebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

